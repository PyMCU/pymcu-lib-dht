# Publishes to PyPI through trusted publishing -- no API token in the repo.
#
# Triggered by a GitHub Release, so the version that goes out is the one that
# was tagged and reviewed. Requires the project to be registered as a trusted
# publisher on PyPI for this repository and workflow.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that the tag matches the version
        if: github.event_name == 'release'
        run: |
          python - <<'PY'
          import os, re, sys, tomllib
          tag = os.environ["TAG"].lstrip("v")
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if tag != version:
              sys.exit(f"tag {tag} does not match pyproject version {version}")
          print(f"tag and version agree: {version}")
          PY
        env:
          TAG: ${{ github.event.release.tag_name }}

      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
